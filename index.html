<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Distribuidora Chibli – Entrega 1 (Login)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="js/firebase-init.js"></script>

<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/login.css">
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <div class="login-logo-wrap">
      <div class="login-logo-icon">
        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M6 14L16 6L26 14V27C26 27.55 25.55 28 25 28H19V21H13V28H7C6.45 28 6 27.55 6 27V14Z" fill="white" opacity=".95"/>
          <path d="M13 21H19V28H13V21Z" fill="white" opacity=".6"/>
        </svg>
      </div>
      <div class="login-brand-name">CHIBLI</div>
      <div class="login-brand-sub">Distribuidora B2B</div>
    </div>
    <input type="hidden" id="login-role-value" value="vendedor" />
    <div class="login-toggle" id="login-toggle">
      <button class="login-toggle-btn active" id="toggle-vendedor" onclick="setLoginRole('vendedor')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="15" height="15"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Vendedor
      </button>
      <button class="login-toggle-btn" id="toggle-admin" onclick="setLoginRole('admin')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="15" height="15"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 010 14.14M4.93 4.93a10 10 0 000 14.14"/></svg>
        Administrador
      </button>
    </div>
    <div class="login-section-title" id="login-title">Ingreso de Preventa</div>
    <div class="login-section-sub" id="login-sub">Ingresa con tu <span>clave de preventista</span> o supervisor asignado.</div>
    
    <div id="login-vendedor-wrap" class="login-field" style="position:relative;">
      <div class="login-field-label">Código de Vendedor</div>
      <div class="login-input-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <input type="text" id="login-vendedor-input" placeholder="Ej: VEN-001 o tu nombre" autocomplete="off" oninput="filterLoginVendedores()" onkeydown="loginVendedorKeydown(event)" />
      </div>
      <input type="hidden" id="login-vendedor-id" />
      <div id="login-vendedor-dropdown" style="display:none; position:absolute; top:100%; left:0; right:0; z-index:9999; margin-top:4px; max-height:180px; overflow-y:auto;"></div>
      <div id="login-vendedor-match"></div>
    </div>

    <div class="login-field" id="login-password-wrap">
      <div class="login-field-label">Contraseña</div>
      <div class="login-input-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
        <input type="password" id="login-password" placeholder="••••••••••" onkeydown="if(event.key==='Enter')doLogin()" />
      </div>
    </div>
    <div class="login-error" id="login-error">Usuario o contraseña incorrectos</div>
    <button class="btn-login" onclick="doLogin()">
      Entrar al Sistema
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="18" height="18"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
    </button>
  </div>
</div>

<div id="toast"></div>

<script src="js/utils.js"></script>
<script src="js/app.js"></script>
<script src="js/login.js"></script>
</body>
</html>
